# Render Blueprint — serviço web (Node) para o Meridiano.
# O servidor serve os ficheiros estáticos e o agente local em /api/fetch.
services:
  - type: web
    name: meridiano
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # O build não precisa de rede para o OCR: vendor/ocr/ (versionado, com sha256 no
    # manifesto) é usado diretamente. `npm run ocr:data` só serve para atualizar essa
    # cópia com o sha512 do registo npm.
    buildCommand: npm ci --omit=dev || npm install --omit=dev --no-audit --no-fund
    startCommand: node tools/serve.mjs
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: AGENT_BUDGET
        value: "60"          # pedidos ao agente local por IP em 10 minutos
      # Cofre das chaves de IA: sem APP_SECRET a aplicação RECUSA guardar chaves
      # (mostra «cofre inactivo» em vez de fingir que guardou). O Render gera o valor.
      - key: APP_SECRET
        generateValue: true
      # Promove a ADMIN o primeiro registo feito com este email. Definir no painel
      # do Render (sync: false) — nunca no repositório.
      - key: ADMIN_EMAIL
        sync: false
      # Registo público: FECHADO quando esta variável não existe. Só abre com o
      # valor `true` escrito de propósito. Não definir por omissão.
      - key: REGISTER_OPEN
        sync: false
      # Arranque do primeiro administrador por HTTPS (POST /api/auth/bootstrap).
      # Sem esta variável a rota responde 503 e nada acontece. Valor longo e
      # aleatório, definido no painel; retirar depois de haver persistência
      # durável (enquanto o disco for efémero, um deploy apaga as contas).
      - key: ADMIN_BOOTSTRAP_TOKEN
        sync: false
      # Persistência durável (Neon/Supabase). Enquanto não existir, /ready
      # declara durableBetweenDeploys:false e os dados morrem em cada deploy.
      - key: DATABASE_URL
        sync: false
      # Pasta de dados. No plano gratuito não há disco: os dados não sobrevivem a
      # um deploy e /api/meta declara-o (durableBetweenDeploys: false).
      - key: DATA_DIR
        value: /opt/render/project/src/.data
      # Opcional: onde estão os dados de língua do OCR. Sem esta variável a aplicação
      # usa a cópia versionada em vendor/ocr (não precisa de rede).
      - key: OCR_LANG_PATH
        value: /opt/render/project/src/vendor/ocr

      # ---------------- chaves de IA do operador (fase 11) ----------------
      # O NOME não precisa de ser exactamente este: a aplicação lê o ambiente sem
      # distinguir maiúsculas e aceita AI_ ou API_ (AI_KEY_GROQ = API_KEY_Groq =
      # api_key_groq). Valores colados com aspas ou espaços são limpos.
      # Cada uma é OPCIONAL. `sync: false` = a variável aparece no painel do Render
      # com o nome certo e o valor é colado lá (nunca no repositório). Só a primeira
      # preenchida é usada; a ordem está em AI_OPERATOR_ORDER.
      # Onde obter cada chave: docs/IA-FORNECEDORES.md
      - key: AI_KEY_GROQ
        sync: false
      - key: AI_KEY_GEMINI
        sync: false
      - key: AI_KEY_CEREBRAS
        sync: false
      - key: AI_KEY_OPENROUTER
        sync: false
      - key: AI_KEY_MISTRAL
        sync: false
      - key: AI_KEY_GITHUB
        sync: false
      - key: AI_KEY_NVIDIA
        sync: false
      - key: AI_KEY_SAMBANOVA
        sync: false
      - key: AI_KEY_HUGGINGFACE
        sync: false
      - key: AI_KEY_COHERE
        sync: false
      - key: AI_KEY_CLOUDFLARE
        sync: false
      # Modelo a usar por fornecedor (opcional; sem isto usa-se o primeiro modelo
      # declarado no catálogo, ver docs/IA-FORNECEDORES.md).
      - key: AI_MODEL_GROQ
        sync: false
      - key: AI_MODEL_GEMINI
        sync: false
      - key: AI_MODEL_OPENROUTER
        sync: false
      # Ordem de preferência das chaves do operador.
      - key: AI_OPERATOR_ORDER
        value: groq,gemini,cerebras,openrouter,mistral,github,nvidia,sambanova,huggingface,cohere,cloudflare
      # Fornecedor SEM CHAVE (Pollinations): dá IA à aplicação sem o utilizador
      # criar conta em lado nenhum. Serviço público de terceiros — não enviar
      # dados pessoais. Pôr `false` desliga-o.
      - key: AI_KEYLESS_FALLBACK
        value: "true"
      - key: AI_MODEL_POLLINATIONS
        sync: false
