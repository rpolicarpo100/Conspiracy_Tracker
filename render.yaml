# Render Blueprint — serviço web (Node) para o Meridiano.
# O servidor serve os ficheiros estáticos e o agente local em /api/fetch.
services:
  - type: web
    name: meridiano
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # O build não precisa de rede para o OCR: vendor/ocr/ (versionado, com sha256 no
    # manifesto) é usado diretamente. `npm run ocr:data` só serve para atualizar essa
    # cópia com o sha512 do registo npm.
    buildCommand: npm ci --omit=dev || npm install --omit=dev --no-audit --no-fund
    startCommand: node tools/serve.mjs
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: AGENT_BUDGET
        value: "60"          # pedidos ao agente local por IP em 10 minutos
      # Cofre das chaves de IA: sem APP_SECRET a aplicação RECUSA guardar chaves
      # (mostra «cofre inactivo» em vez de fingir que guardou). O Render gera o valor.
      - key: APP_SECRET
        generateValue: true
      # Promove a ADMIN o primeiro registo feito com este email. Definir no painel
      # do Render (sync: false) — nunca no repositório.
      - key: ADMIN_EMAIL
        sync: false
      # Registo público: FECHADO quando esta variável não existe. Só abre com o
      # valor `true` escrito de propósito. Não definir por omissão.
      - key: REGISTER_OPEN
        sync: false
      # Arranque do primeiro administrador por HTTPS (POST /api/auth/bootstrap).
      # Sem esta variável a rota responde 503 e nada acontece. Valor longo e
      # aleatório, definido no painel; retirar depois de haver persistência
      # durável (enquanto o disco for efémero, um deploy apaga as contas).
      - key: ADMIN_BOOTSTRAP_TOKEN
        sync: false
      # Persistência durável (Neon/Supabase). Enquanto não existir, /ready
      # declara durableBetweenDeploys:false e os dados morrem em cada deploy.
      - key: DATABASE_URL
        sync: false
      # Pasta de dados. No plano gratuito não há disco: os dados não sobrevivem a
      # um deploy e /api/meta declara-o (durableBetweenDeploys: false).
      - key: DATA_DIR
        value: /opt/render/project/src/.data
      # Opcional: onde estão os dados de língua do OCR. Sem esta variável a aplicação
      # usa a cópia versionada em vendor/ocr (não precisa de rede).
      - key: OCR_LANG_PATH
        value: /opt/render/project/src/vendor/ocr
