# Render Blueprint — serviço web (Node) para o Meridiano.
# O servidor serve os ficheiros estáticos e o agente local em /api/fetch.
services:
  - type: web
    name: meridiano
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # O build descarrega os dados de língua do OCR com integridade conferida contra
    # o registo npm. Se falhar, o build NÃO falha: a aplicação arranca e declara
    # «OCR indisponível» em /api/meta (em vez de prometer o que não tem).
    buildCommand: (npm ci --omit=dev || npm install --omit=dev --no-audit --no-fund) && (node tools/fetch-ocr-data.mjs || echo 'AVISO: dados de OCR não obtidos; OCR ficará indisponível')
    startCommand: node tools/serve.mjs
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: AGENT_BUDGET
        value: "60"          # pedidos ao agente local por IP em 10 minutos
      # Cofre das chaves de IA: sem APP_SECRET a aplicação RECUSA guardar chaves
      # (mostra «cofre inactivo» em vez de fingir que guardou). O Render gera o valor.
      - key: APP_SECRET
        generateValue: true
      # Promove a ADMIN o primeiro registo feito com este email. Definir no painel
      # do Render (sync: false) — nunca no repositório.
      - key: ADMIN_EMAIL
        sync: false
      # Pasta de dados. No plano gratuito não há disco: os dados não sobrevivem a
      # um deploy e /api/meta declara-o (durableBetweenDeploys: false).
      - key: DATA_DIR
        value: /opt/render/project/src/.data
      # Onde estão os dados de língua do OCR (descarregados no build).
      - key: OCR_LANG_PATH
        value: /opt/render/project/src/.data/ocr
