<!DOCTYPE html>
<html lang="pt-PT" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Meridiano · Rede de investigação visual</title>
<meta name="description" content="Grafo interactivo de entidades, relações tipificadas e provas documentais. Prova de conceito com dados fictícios.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e1a24'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2337d0a0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<a class="skip" href="#graphwrap">Saltar para o grafo</a>

<header class="topbar" role="banner">
  <div class="brand">
    <svg class="brandmark" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 3l11 6.5v13L16 29 5 22.5v-13z" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="16" cy="11" r="2.6" fill="currentColor"/><circle cx="10" cy="20" r="2.2" fill="currentColor" opacity=".8"/>
      <circle cx="22" cy="20" r="2.2" fill="currentColor" opacity=".8"/>
      <path d="M16 13.5v3M11.6 18.2l1.8-5M20.4 18.2l-1.8-5" stroke="currentColor" stroke-width="1.2" fill="none"/>
    </svg>
    <div class="brandtext">
      <strong>Meridiano</strong>
      <span>Rede de investigação visual</span>
    </div>
    <button class="badge-fic" id="fictionBadge" type="button" title="Abrir nota metodológica">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5l6 3v4c0 3-2.6 5.3-6 6-3.4-.7-6-3-6-6v-4z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 5v4M8 11v.6" stroke="currentColor" stroke-width="1.4"/></svg>
      Dados fictícios
    </button>
  </div>

  <div class="searchwrap" role="search">
    <label class="sr-only" for="search">Pesquisar entidades, documentos, identificadores</label>
    <svg class="searchicon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13.2 13.2L17 17" stroke="currentColor" stroke-width="1.6"/></svg>
    <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Pesquisar entidade, alias, documento, ID…" aria-expanded="false" aria-controls="searchresults" role="combobox">
    <kbd class="kbd">⌘K</kbd>
    <div class="searchresults" id="searchresults" role="listbox" aria-label="Resultados da pesquisa" hidden></div>
  </div>

  <div class="topactions">
    <button id="btnList" class="iconbtn" type="button" title="Vista em lista (acessível)" aria-label="Vista em lista acessível">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.7"/></svg>
    </button>
    <button id="btnQuality" class="iconbtn" type="button" title="Qualidade dos dados" aria-label="Qualidade dos dados">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5l7 3v4.2c0 3.6-3 6.4-7 7.3-4-.9-7-3.7-7-7.3V5.5z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 9.6l2.2 2.2L13.4 7.6" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
    </button>
    <button id="btnTheme" class="iconbtn" type="button" title="Alternar tema claro / escuro" aria-label="Alternar tema" aria-pressed="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.2v2M10 14.8v2M3.2 10h2M14.8 10h2M5.2 5.2l1.4 1.4M13.4 13.4l1.4 1.4M14.8 5.2l-1.4 1.4M6.6 13.4l-1.4 1.4" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="3.1" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
    <button id="btnConsole" class="btn" type="button" title="Consola de investigação: perguntas, fontes, provas, IA">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4.5h14v9H8l-4 3v-3H3z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="7.4" cy="9" r="1" fill="currentColor"/><circle cx="10" cy="9" r="1" fill="currentColor"/><circle cx="12.6" cy="9" r="1" fill="currentColor"/></svg>
      Investigar
    </button>
    <button id="btnExport" class="btn primary" type="button">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9M6.4 8.6L10 12.2l3.6-3.6M4 14.4v1.8c0 .6.4 1 1 1h10c.6 0 1-.4 1-1v-1.8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      Exportar
    </button>
    <button id="btnAccount" class="btn" type="button" title="Conta, projectos, chaves de IA e administração">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="7" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 17c.6-3.2 3-5 6-5s5.4 1.8 6 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      <span id="accLabel">Conta</span>
    </button>
    <button id="btnHelp" class="iconbtn" type="button" title="Ajuda e atalhos" aria-label="Ajuda e atalhos">?</button>
  </div>
</header>

<main class="layout" role="main">
  <!-- ============ FILTROS ============ -->
  <aside class="sidebar" id="sidebar" aria-label="Filtros e configuração">
    <div class="sidetabs" role="tablist" aria-label="Painel esquerdo">
      <button class="sidetab active" role="tab" aria-selected="true" data-sidetab="filters">Filtros</button>
      <button class="sidetab" role="tab" aria-selected="false" data-sidetab="analysis">Análise</button>
      <button class="sidetab" role="tab" aria-selected="false" data-sidetab="legend">Legenda</button>
      <button class="sidetab" role="tab" aria-selected="false" data-sidetab="history">Histórico</button>
    </div>
    <div class="sidebody" id="sidebody"></div>
    <div class="sidefoot">
      <button id="btnUndo" class="ghostbtn" type="button" title="Anular (U)">↶ Anular</button>
      <button id="btnRedo" class="ghostbtn" type="button" title="Refazer (Shift+U)">↷ Refazer</button>
      <button id="btnResetFilters" class="ghostbtn" type="button" title="Limpar filtros">Limpar</button>
    </div>
  </aside>

  <!-- ============ GRAFO ============ -->
  <section class="graphcol" id="graphwrap" aria-label="Grafo de relações">
    <div class="toolbar" role="toolbar" aria-label="Ferramentas do grafo">
      <div class="tgroup">
        <button class="iconbtn" data-act="zoomin" title="Aproximar (+)" aria-label="Aproximar">+</button>
        <button class="iconbtn" data-act="zoomout" title="Afastar (−)" aria-label="Afastar">−</button>
        <button class="iconbtn" data-act="fit" title="Ajustar à vista (F)" aria-label="Ajustar à vista">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V3h4M17 7V3h-4M3 13v4h4M17 13v4h-4" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
        </button>
        <span class="toolsep"></span>
        <button class="iconbtn" data-act="center" title="Centrar na selecção (C)" aria-label="Centrar na selecção">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2v3M10 15v3M2 10h3M15 10h3" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
        <button class="iconbtn" data-act="expand1" title="Expandir ligações directas (E)" aria-label="Expandir ligações directas">E¹</button>
        <button class="iconbtn" data-act="expand2" title="Expandir dois níveis" aria-label="Expandir dois níveis">E²</button>
        <button class="iconbtn" data-act="collapse" title="Recolher ramo (R)" aria-label="Recolher ramo">R</button>
      </div>
      <div class="tgroup">
        <button class="iconbtn" id="btnPath" data-act="path" title="Modo caminhos (P)" aria-label="Modo caminhos" aria-pressed="false">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4.5" cy="10" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="15.5" cy="10" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6.7 10h6.6" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 2"/></svg>
        </button>
        <button class="iconbtn" data-act="labels" title="Etiquetas (L)" aria-label="Alternar etiquetas" aria-pressed="true">Aa</button>
        <button class="iconbtn" data-act="group" title="Agrupar vizinhos não carregados (G)" aria-label="Agrupar vizinhos" aria-pressed="true">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="3" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="11" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M13.5 12v4.5M11.2 14.2h4.6" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
        <button class="iconbtn" data-act="hide" title="Ocultar selecção (H)" aria-label="Ocultar selecção">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 10s3-5 7.5-5 7.5 5 7.5 5-3 5-7.5 5S2.5 10 2.5 10z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4 16L16 4" stroke="currentColor" stroke-width="1.7"/></svg>
        </button>
      </div>
      <div class="tgroup">
        <label class="toolsel">
          <span class="sr-only">Layout</span>
          <select id="layoutSel" aria-label="Algoritmo de disposição">
            <option value="fcose">Disposição: força (incremental)</option>
            <option value="concentric">Disposição: concêntrica por grau</option>
          </select>
        </label>
      </div>
    </div>

    <div id="cy" class="cy" tabindex="0" role="application" aria-label="Grafo interactivo. Use a pesquisa para localizar uma entidade; setas para deslocar; + e − para zoom."></div>
    <div id="tooltip" class="tooltip" hidden role="status" aria-live="polite"></div>
    <div id="ctxmenu" class="ctxmenu" hidden role="menu"></div>

    <div class="pathbar" id="pathbar" hidden>
      <div class="pathhead">
        <strong>Caminhos documentados</strong>
        <button class="linkbtn" id="pathClose" aria-label="Fechar modo caminhos">✕</button>
      </div>
      <div class="pathfields">
        <div class="pathfield"><span class="lbl">Origem</span><span class="val" id="pathA">—</span></div>
        <div class="pathfield"><span class="lbl">Destino</span><span class="val" id="pathB">—</span></div>
        <label class="inline"><span>Passos</span><input id="pathSteps" type="number" min="1" max="6" value="4" aria-label="Número máximo de passos"></label>
        <label class="inline"><input id="pathExcludeDocs" type="checkbox" checked> <span>Excluir documentos e acontecimentos</span></label>
        <button class="btn primary sm" id="pathRun" type="button">Procurar</button>
      </div>
      <p class="pathwarn">Um caminho demonstra apenas que existem relações registadas entre entidades. Não é prova de coordenação, acordo ou cumplicidade.</p>
    </div>

    <div class="legendbar" id="legendbar" aria-label="Legenda rápida"></div>
  </section>

  <!-- ============ DETALHES ============ -->
  <aside class="details" id="details" aria-label="Painel de detalhes">
    <div class="detailshead">
      <div class="detailstabs" role="tablist" aria-label="Detalhes">
        <button class="dtab active" role="tab" data-dtab="summary" aria-selected="true">Entidade</button>
        <button class="dtab" role="tab" data-dtab="relation" aria-selected="false">Ligação</button>
        <button class="dtab" role="tab" data-dtab="paths" aria-selected="false">Caminhos</button>
        <button class="dtab" role="tab" data-dtab="timeline" aria-selected="false">Cronologia</button>
      </div>
      <button class="iconbtn" id="detailsClose" title="Fechar painel" aria-label="Fechar painel">✕</button>
    </div>
    <div class="detailsbody" id="detailsbody"></div>
  </aside>
</main>

<!-- ============ CRONOLOGIA + ESTADO ============ -->
<footer class="bottom" id="bottom">
  <div class="timelinehead">
    <button class="iconbtn sm" id="timelineToggle" aria-expanded="true" title="Mostrar/ocultar cronologia" aria-label="Mostrar ou ocultar cronologia">▾</button>
    <strong>Cronologia sincronizada</strong>
    <span class="muted" id="timelineSummary">todas as datas</span>
    <div class="tlcontrols">
      <button class="ghostbtn sm" id="tlAll" type="button">Todo o período</button>
      <button class="ghostbtn sm" id="tlClear" type="button">Sem filtro temporal</button>
      <label class="inline"><input type="checkbox" id="tlUnknown" checked> <span>Incluir relações sem data</span></label>
    </div>
  </div>
  <div class="timeline" id="timeline" aria-label="Cronologia: seleccione um intervalo"></div>
  <div class="statusbar" role="status" aria-live="polite">
    <span id="statCounts">—</span>
    <span class="dotsep">·</span>
    <span id="statFilters">sem filtros</span>
    <span class="grow"></span>
    <span id="statPerf" title="Indicadores de desempenho medidos localmente">—</span>
    <span class="dotsep">·</span>
    <span id="statAction">—</span>
    <button class="ghostbtn xs" id="btnPerf" title="Abrir painel de desempenho">desempenho</button>
  </div>
</footer>

<!-- ============ MODAIS ============ -->
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modalscrim" data-close="1"></div>
  <div class="modalcard" role="document">
    <div class="modalhead">
      <h2 id="modalTitle">—</h2>
      <button class="iconbtn" data-close="1" aria-label="Fechar">✕</button>
    </div>
    <div class="modalbody" id="modalBody"></div>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
<noscript><p style="padding:2rem;color:#e2e8f0">Esta aplicação necessita de JavaScript.</p></noscript>

<script src="vendor/cytoscape.min.js"></script>
<script src="vendor/layout-base.js"></script>
<script src="vendor/cose-base.js"></script>
<script src="vendor/cytoscape-fcose.js"></script>
<script src="data/00-schema.js"></script>
<script src="data/10-people.js"></script>
<script src="data/20-companies.js"></script>
<script src="data/30-institutions.js"></script>
<script src="data/40-documents.js"></script>
<script src="data/50-events.js"></script>
<script src="data/60-relations.js"></script>
<script src="data/70-relations-flows.js"></script>
<script src="src/core/model.js"></script>
<script src="src/core/query.js"></script>
<script src="src/core/store.js"></script>
<script src="src/core/ledger.js"></script>
<script src="src/core/research.js"></script>
<script src="src/core/realdata.js"></script>
<script src="src/core/agents.js"></script>
  <script src="src/core/apis.js"></script>
  <script src="src/core/index.js"></script>
<script src="src/core/search.js"></script>
<script src="src/graph/avatars.js"></script>
<script src="src/graph/adapter.js"></script>
<script src="src/ui/dom.js"></script>
<script src="src/ui/panels.js"></script>
<script src="src/ui/details.js"></script>
<script src="src/ui/paths.js"></script>
<script src="src/ui/timeline.js"></script>
<script src="src/ui/report.js"></script>
<script src="src/ui/list.js"></script>
<script src="src/ui/palette.js"></script>
<script src="src/ui/searchpage.js"></script>
<script src="src/ui/apis.js"></script>
  <script src="src/ui/account.js"></script>
<script src="src/ui/console.js"></script>
<script src="src/app.js"></script>
</body>
</html>
