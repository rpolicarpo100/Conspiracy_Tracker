# Reavaliação agendada do Provider OS (fase 7).
#
# Chama POST /api/provider-os/cron/run com o token de serviço. O endpoint SÓ
# existe para este uso se CRON_TOKEN estiver definido no servidor (Render);
# sem ele responde 503 e não faz nada — um cron aberto seria um endpoint aberto.
#
# Configuração (uma vez):
#   1. Render → Environment → CRON_TOKEN = <valor aleatório longo>
#   2. GitHub → Settings → Secrets and variables → Actions → New secret
#      Name: CRON_TOKEN   Value: o mesmo valor
#
# O que corre: níveis 1–2 apenas (documentação e acesso), sem chave e sem custo.
# Nada é pago, nada é promovido sem PASS.
name: Provider OS — reavaliação agendada

on:
  schedule:
    - cron: '17 6 * * *'      # uma vez por dia, 06:17 UTC
  workflow_dispatch:           # e a pedido, para testar

jobs:
  reevaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Chamar o cron do serviço
        env:
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          BASE: https://conspiracy-aitracker.onrender.com
        run: |
          if [ -z "$CRON_TOKEN" ]; then
            echo "::error::O segredo CRON_TOKEN não está definido neste repositório."
            exit 1
          fi
          # o plano gratuito do Render adormece: acordar primeiro, com paciência
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$BASE/health" || true)
            echo "health: $code (tentativa $i)"
            [ "$code" = "200" ] && break
            sleep 20
          done
          echo "--- cron/run"
          resposta=$(curl -sS --max-time 120 -X POST "$BASE/api/provider-os/cron/run" \
            -H "x-cron-token: $CRON_TOKEN" -H 'content-type: application/json' -d '{}' -w '\nHTTP %{http_code}')
          echo "$resposta"
          echo "$resposta" | grep -q 'HTTP 200' || { echo "::error::O cron respondeu com erro"; exit 1; }
